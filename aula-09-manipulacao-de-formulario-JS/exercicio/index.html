<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manipulação de Formulários</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Calculadora em JavaScript</h1>
    <p>Digite dois números para realizar as operações:</p>
    <div class="inserir">
      <input
        type="number"
        id="num1"
        placeholder="Digite o primeiro número"
        min="0"
      />
      <p>e</p>
      <input
        type="number"
        id="num2"
        placeholder="Digite o segundo número"
        min="0"
      />
    </div>
    <br />
    <p>Selecione a operação:</p>
    <div class="botoes">
      <button onclick="somar()" class="botao">+</button>
      <button onclick="subtrair()" class="botao">-</button>
      <button onclick="multiplicar()" class="botao">×</button>
      <button onclick="dividir()" class="botao">÷</button>
    </div>

    <!-- EXIBIR RESULTADO -->
    <div>
      <p>Resultado:</p>
      <p id="resultado"></p>
    </div>
    <button onclick="limpar()" class="botaoLimpar">Limpar</button>
    <script src="script.js"></script>
  </body>
</html>
